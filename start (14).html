<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bekijk op de website</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0a0a0a;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .icon {
    width: 76px; height: 76px;
    margin: 0 auto 26px;
    border-radius: 22px;
    background: rgba(249,115,22,0.12);
    border: 1px solid rgba(249,115,22,0.35);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(249,115,22,0.25);
  }
  .icon svg { width: 38px; height: 38px; }
  h1 {
    font-size: 34px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.5px;
    color: #f97316;
    margin-bottom: 12px;
  }
  p {
    font-size: 16px;
    line-height: 1.5;
    color: rgba(255,255,255,0.65);
    margin-bottom: 30px;
  }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 16px;
    background: #f97316;
    color: #fff;
    font-family: inherit;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(249,115,22,0.35);
    transition: transform .15s ease, background .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: #ea670c; }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 20px; height: 20px; }
  .note {
    margin-top: 18px;
    font-size: 12px;
    color: rgba(255,255,255,0.35);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M2 12h20"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
  </div>

  <h1>Bekijk op de website</h1>
  <p>Tik op de knop hieronder om verder te gaan naar de website.</p>

  <button class="btn" onclick="goToLander()">
    Ga naar de website
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </button>

  <div class="note">🔒 100% veilig</div>
</div>

<script>
// Stuurt de bezoeker naar de lander (index.html in hetzelfde project) en behoudt URL-parameters (bijv. s1)
function goToLander() {
  var target = (window.location.protocol === 'file:') ? 'index.html' : './';
  window.location.href = target + window.location.search;
}
</script>

</body>
</html>
